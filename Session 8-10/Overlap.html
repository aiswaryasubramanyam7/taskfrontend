<!DOCTYPE html>
    <head>
        <style>
           
            .box-1{
                background-color: aqua;
                border:10px solid yellow;
                width:100px;
                height:100px;
                position:relative;
                top:10px;
            }
            .box-2{
                background-color: blue;
                border: 10px solid black;
                width: 100px;
                height:100px;
                position:absolute;
                top:20px;
                left:20px;
            }
            .box-3{
                background-color:purple;
                border: 10px solid black;
                width: 100px;
                height:100px;
                position:absolute;
                top:50px;
                right:50px;
            }
         
        </style>
    </head>
    <body>
     
       <div class="box-1">Box-1<br><br>
       <div class="box-2">Box-2</div><br><br></div>
       <div class="box-3">Box-3</div><br><br>
    </body>
</html>
