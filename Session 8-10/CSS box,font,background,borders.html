<!DOCTYPE html>
    <head>
        <style>
            body{
                border: 2px dashed red;
                border-radius: 10px;
                background-color: chartreuse;
            }
            .box-1{
                background-color: aqua;
                border:10px solid yellow;
                padding: 20px 40px 20px;
                width:100px;
                height:100px;
                margin:30px 30px 30px 30px;
            }
            .box-2{
                background-color: blue;
                border: 10px solid black;
                padding: 20px 40px 20px;
                width: 100px;
                height:100px;
                margin:30px 30px 30px 30px;
                border-radius: 10px;
            }
            .text{
                background-color: dimgrey;
                background-size:cover;
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-size: 30px;
                font-weight: bold;
                line-height: 1.5;
                text-align: center;
                letter-spacing: 3px;
                color:chocolate;
                }
            p::first-letter{
                font-size:70px;
            }
        </style>
    </head>
    <body>
       <div class="box-1">Box-2</div><br>
       <br>
       <div class="box-2">Box-2</div>
       <p class="text">Hey! this is AISWARYA</p>
        
    </body>
</html>
