<!DOCTYPE html>
    <head>
        <style>
            body{
                background-color: chartreuse;
                
            }
            .box-1{
                background-color: aqua;
                border:10px solid yellow;
                width:100px;
                height:100px;
                position:relative;
                top:10px;
            
            }
            .box-2{
                background-color: blue;
                border: 10px solid black;
                width: 100px;
                height:100px;
                position:absolute;
                bottom:0;
                left:0;
                
            }
            .box-3{
                background-color:purple;
                border: 10px solid black;
                width: 100px;
                height:100px;
                position:fixed;
                left:0;

                
            }
         
        </style>
    </head>
    <body>
        <div class="parent">Parent</div>
       <div class="box-1">Box-1<br><br></div>
       <div class="box-2">Box-2</div><br><br>
       <div class="box-3">Box-3</div><br><br>
       
       
       
  
        
    </body>
</html>
