<html>
    <head>
        <style>
            
            a:visited {
                color: green;
            }
            a:active {
                color: blue;
            } 
            a:hover{
                color:purple;
            } 
            input:focus{
                border-color:red;
            }
            p::first-letter{
                font-size:2em;
                font-style:italic;
            }
        </style>    
    </head>
    <body>
        <a href="www.google.com">Google</a>
        <label for="Submit"></label>
        <input type="submit">
        <p>Hello</p>
        <p>Welcome to my world</p>
    </body>
</html>
