<!DOCTYPE html> 
<html> 
<head> 
  <style> 
    * { 
      box-sizing: border-box; 
    } 
 
    .card { 
      width: 300px; 
      padding: 20px; 
      border: 1px solid #ccc; 
      margin: 20px auto; 
      font-family: sans-serif; 
    } 
 
    #title { 
      color: navy; 
      text-align: center; 
    } 
 
    .card p { 
      font-size: 16px; 
    } 
 
    .card:hover { 
      background-color: #f0f0f0; 
    } 
 
    .card::after { 
      content: "🎉";
     
      display: block; 
      text-align: center; 
      font-size: 20px; 
    } 
  </style> 
</head> 
<body> 
  <div class="card"> 
    <h2 id="title">CSS Mastery</h2> 
    <p>You're on your way to becoming a pro!</p> 
  </div> 
</body> 
</html>
