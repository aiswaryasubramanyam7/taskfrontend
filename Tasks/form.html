<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<style>
    body{
        background-color: darkgrey;
    }
    input[type=submit]:hover{
        background-color: forestgreen;
    }
    input[type=radio]:visited{
        color:red;
    }
</style>
</head>
<body>

<form action="Index.html" method="POST">
    <table align="center">
    <tr><td><h2>Registration Form</h2></td></tr>
    <tr><td colspan="2"></td></tr>
<tr>
<td><label for="firstname">First Name:</label>
  <input type="text"name="first name"id="name"><br><br>
  </td></tr>
  <tr>
<td><label for="lastname">Last Name:</label>
  <input type="text"><br><br></td></tr>
  <tr>
<td><label for="dob">Dob:</label>
  <input type="date"name="dob"id="dob"><br><br></td></tr>
  <tr>
<td><label for="Gender">Gender</label>
  <input type="radio" id="male"name="gender"value="male">
  <label for="Male">Male</label>
  <input type="radio" id="Female"name="gender"value="Female">
  <label for="Female">Female</label><br><br></td></tr>
  <tr>
<td><label for="email">Email:</label>
  <input type="email"><br><br></td></tr>
  <tr>
<td><label for="password">Password:</label>
  <input type="password"><br><br></td></tr>
  <tr>
<td><label for="cofirmpassword">Cofirm Password:</label>
  <input type="password"><br><br></td></tr>
  <tr>
<td><input type="submit" value="Register"></td></tr>
  </table>
  </form>
</body>
</html>
